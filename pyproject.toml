[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vidforge"
version = "0.4.0"
description = "Script-to-video assembly line: segmented script JSON -> TTS -> subtitles -> Ken Burns -> ffmpeg"
requires-python = ">=3.10"
dependencies = [
    "edge-tts>=7.0",
    "Pillow>=10.0",
    "certifi",          # CA bundle for python.org's macOS build, which has none (see vidforge/__init__.py)
]

[project.optional-dependencies]
youtube = ["google-api-python-client>=2.100", "google-auth-oauthlib>=1.2"]
dev = ["playwright>=1.45"]
browser = ["playwright>=1.45"]
video = ["opencv-python>=4.8"]   # face detection for `vidforge video heads` (installed on first use too)
voxcpm = ["voxcpm", "soundfile"]   # free/local Voice Design alt to ElevenLabs; pulls in PyTorch, install on the render machine only
align = ["faster-whisper>=1.0"]   # (see above)
refs = ["yt-dlp>=2025.1"]          # 参考视频: download from YouTube / TikTok / … (B站 goes through its own API)   # force-align your own narration to the script (`Segment.narration`); without it subtitle times are spread evenly

[project.scripts]
vidforge = "vidforge.cli:main"

[tool.setuptools.packages.find]
include = ["vidforge*"]

[tool.setuptools.package-data]
vidforge = ["ui/react/dist/*", "ui/react/dist/assets/*",
            "remotion/app/*.json", "remotion/app/*.ts", "remotion/app/src/*", "remotion/app/src/compositions/*"]
