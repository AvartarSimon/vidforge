[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vidforge"
version = "0.4.0"
description = "Script-to-video assembly line: segmented script JSON -> TTS -> subtitles -> Ken Burns -> ffmpeg"
requires-python = ">=3.10"
dependencies = [
    "edge-tts>=7.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
youtube = ["google-api-python-client>=2.100", "google-auth-oauthlib>=1.2"]
dev = ["playwright>=1.45"]
browser = ["playwright>=1.45"]
voxcpm = ["voxcpm", "soundfile"]   # free/local Voice Design alt to ElevenLabs; pulls in PyTorch, install on the render machine only

[project.scripts]
vidforge = "vidforge.cli:main"

[tool.setuptools.packages.find]
include = ["vidforge*"]

[tool.setuptools.package-data]
vidforge = ["ui/static/*", "remotion/app/*.json", "remotion/app/*.ts", "remotion/app/src/*", "remotion/app/src/compositions/*"]
