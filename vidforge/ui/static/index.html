<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vidforge</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>vidforge</h1>
  <span class="path" id="path"></span>
  <span class="health" id="health"></span>
  <label class="muted">语言 <select id="lang"></select></label>
  <span class="pill" id="saveState">已保存</span>
</header>

<nav class="steps" id="steps">
  <button data-step="1"><span class="n">1</span>脚本</button>
  <button data-step="2"><span class="n">2</span>配音</button>
  <button data-step="3"><span class="n">3</span>画面</button>
  <button data-step="4"><span class="n">4</span>渲染</button>
  <button data-step="5"><span class="n">5</span>发布</button>
</nav>

<main>
  <div id="issues"></div>
  <div id="tour"></div>
  <section id="view"></section>
  <div class="footer-nav"><button id="prev">← 上一步</button><button class="primary" id="next">下一步 →</button></div>
</main>

<div id="modal"></div>
<script src="/static/app.js"></script>
</body>
</html>
